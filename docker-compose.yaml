# Sample docker-compose config for running share-lan via Docker.
#
# Before starting:
#   mkdir -p shared && cp files-you-want-to-share shared/
#   docker compose up -d
#   docker compose logs -f   # to see the QR code + 4-digit code
#
# Other options you can add to `command:`:
#   --read-only        disable uploads from recipients
#   --no-qr             don't print the QR code in the logs
#   --code 1234         use your own code instead of a random one
#   --max-upload 2G      per-upload size limit
#
# Networking note: by default only port 8000 is published, so share-lan still
# runs fine but the address it detects for the QR/banner is Docker's internal
# address, not the host's real LAN IP. If QR/`--ip` auto-detection doesn't
# connect, use `network_mode: host` below (Linux only) so it sees the real
# host network.
services:
  lanshare:
    image: ghcr.io/harizinside/share-lan:latest
    # Or build from local source instead of pulling from GHCR:
    # build: .
    ports:
      - "8000:8000"
    volumes:
      - ./shared:/data
    command: ["/data", "--code", "1234"]
    restart: unless-stopped
    # network_mode: host   # uncomment (Linux) for accurate LAN IP detection
