# Sample docker-compose config buat jalanin share-lan lewat Docker.
#
# Sebelum start:
#   mkdir -p shared && cp file-file-yang-mau-dibagi shared/
#   docker compose up -d
#   docker compose logs -f   # buat lihat QR + kode 4 digit
#
# Opsi lain yang bisa ditambahin ke `command:`:
#   --read-only        matiin upload dari penerima
#   --no-qr             jangan cetak QR di log
#   --code 1234         pakai kode sendiri, bukan yang acak
#   --max-upload 2G      batas ukuran per upload
#
# Catatan jaringan: default-nya cuma port 8000 yang di-publish, jadi share-lan
# masih bisa jalan tapi alamat yang dia deteksi buat QR/banner adalah alamat
# internal Docker, bukan IP LAN host. Kalau QR/`--ip` auto-detect nggak nyambung,
# pakai `network_mode: host` di bawah (Linux only) biar dia lihat network host
# beneran.
services:
  lanshare:
    image: ghcr.io/harizinside/share-lan:latest
    # Atau build dari source lokal, bukan pull dari GHCR:
    # build: .
    ports:
      - "8000:8000"
    volumes:
      - ./shared:/data
    command: ["/data", "--code", "1234"]
    restart: unless-stopped
    # network_mode: host   # uncomment (Linux) buat deteksi IP LAN yang akurat
