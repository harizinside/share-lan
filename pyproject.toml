[project]
name = "share-lan"
version = "0.0.3"
description = "Share files over a WiFi/LAN network — recipients just scan a QR or type the IP + a 4-digit code"
requires-python = ">=3.9"
dependencies = [
    "qrcode",
    "pillow",
    "pypdfium2>=4.30,<6",
]

[project.optional-dependencies]
viewer = ["groupdocs-viewer-net"]

[project.scripts]
sharelan = "lanshare.cli:main"
lanshare = "lanshare.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lanshare"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",    # line length is handled by the formatter, not reported here
    "B008",    # function calls in default arguments: not used that way here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # tests insert into sys.path before importing lanshare

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
